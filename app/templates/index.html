<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Crop Recommendation System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Smooth light/dark mode transitions */
        body { 
            transition: background-color 0.3s ease, color 0.3s ease; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Card & Theme Overrides */
        .card { 
            border-radius: 14px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
            border: 1px solid rgba(0,0,0,0.08); 
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Dark Mode Styling */
        [data-bs-theme="dark"] body { 
            background-color: #121212 !important; 
            color: #e0e0e0 !important; 
        }
        [data-bs-theme="dark"] .card { 
            background-color: #1e1e1e !important; 
            color: #e0e0e0 !important; 
            border-color: #333 !important; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        [data-bs-theme="dark"] .bg-light-custom { 
            background-color: #282828 !important; 
            border-color: #3d3d3d !important; 
        }
        [data-bs-theme="dark"] .form-control { 
            background-color: #2b2b2b; 
            color: #ffffff; 
            border-color: #444; 
        }
        [data-bs-theme="dark"] .form-control:focus { 
            background-color: #333; 
            color: #fff; 
            border-color: #2e7d32;
        }

        /* Light Mode Custom Backgrounds */
        .bg-light-custom {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 576px) {
            .container {
                padding-left: 12px;
                padding-right: 12px;
            }
            .main-title {
                font-size: 1.4rem;
            }
            .card {
                padding: 1.25rem !important;
            }
            .btn-theme-toggle {
                font-size: 0.85rem;
                padding: 0.35rem 0.65rem;
            }
            .input-group-mobile {
                flex-direction: column;
            }
            .input-group-mobile input {
                border-radius: 0.375rem !important;
                margin-bottom: 0.5rem;
            }
            .input-group-mobile button {
                border-radius: 0.375rem !important;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Responsive Header Bar with Dark Mode Toggle -->
    <nav class="navbar navbar-expand border-bottom mb-4 px-3 py-2">
        <div class="container-fluid max-width-container">
            <span class="navbar-brand fw-bold text-success fs-5">🌱 Crop AI</span>
            <button class="btn btn-outline-secondary btn-sm rounded-pill btn-theme-toggle ms-auto" id="themeToggle" onclick="toggleNightMode()">
                🌙 Dark Mode
            </button>
        </div>
    </nav>

    <div class="container pb-5" style="max-width: 720px;">
        <!-- Header Card -->
        <div class="card p-4 mb-3 text-center">
            <h1 class="main-title text-success fw-bold mb-2">Smart Crop Recommendation</h1>
            <p class="text-secondary small mb-0">Input soil features or fetch live weather by location to identify the optimal crop.</p>
        </div>

        <!-- Main Form Card -->
        <div class="card p-4">
            <form id="cropForm">
                
                <!-- Weather Auto-Fetch Box -->
                <div class="p-3 mb-4 bg-light-custom rounded-3">
                    <label class="form-label fw-semibold text-primary mb-2">🌤️ Auto-Fetch Live Weather</label>
                    <div class="input-group input-group-mobile">
                        <input type="text" id="city" class="form-control" placeholder="Enter City (e.g., Nagpur, Delhi)">
                        <button type="button" class="btn btn-primary" onclick="fetchWeather()">Fetch Weather</button>
                    </div>
                    <div id="weatherStatus" class="form-text text-muted mt-2">Fetches current Temperature & Humidity.</div>
                </div>

                <!-- Input Parameters Grid -->
                <div class="row g-3">
                    <div class="col-6 col-sm-4">
                        <label class="form-label small fw-medium">Nitrogen (N)</label>
                        <input type="number" step="any" id="N" class="form-control" value="90" required>
                    </div>
                    <div class="col-6 col-sm-4">
                        <label class="form-label small fw-medium">Phosphorus (P)</label>
                        <input type="number" step="any" id="P" class="form-control" value="42" required>
                    </div>
                    <div class="col-6 col-sm-4">
                        <label class="form-label small fw-medium">Potassium (K)</label>
                        <input type="number" step="any" id="K" class="form-control" value="43" required>
                    </div>

                    <div class="col-6 col-sm-6">
                        <label class="form-label small fw-medium">Temperature (°C)</label>
                        <input type="number" step="any" id="temperature" class="form-control" value="20.87" required>
                    </div>
                    <div class="col-6 col-sm-6">
                        <label class="form-label small fw-medium">Humidity (%)</label>
                        <input type="number" step="any" id="humidity" class="form-control" value="82.00" required>
                    </div>

                    <div class="col-6 col-sm-6">
                        <label class="form-label small fw-medium">Soil pH</label>
                        <input type="number" step="any" id="ph" class="form-control" value="6.50" required>
                    </div>
                    <div class="col-6 col-sm-6">
                        <label class="form-label small fw-medium">Rainfall (mm)</label>
                        <input type="number" step="any" id="rainfall" class="form-control" value="202.93" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-success w-100 mt-4 py-2 fw-semibold">Predict Best Crop</button>
            </form>

            <!-- Prediction Result Container -->
            <div id="resultCard" class="mt-4 p-3 rounded-3 text-center d-none">
                <h5 class="mb-1">Recommended Crop: <span id="cropName" class="text-uppercase text-success fw-bold"></span></h5>
                <small class="text-secondary">Confidence Score: <span id="confidence"></span></small>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // 1. Dark Mode Theme Controller
        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            const toggleBtn = document.getElementById('themeToggle');
            if (theme === 'dark') {
                toggleBtn.innerHTML = '☀️ Light Mode';
                toggleBtn.classList.replace('btn-outline-secondary', 'btn-outline-warning');
            } else {
                toggleBtn.innerHTML = '🌙 Dark Mode';
                toggleBtn.classList.replace('btn-outline-warning', 'btn-outline-secondary');
            }
            localStorage.setItem('theme', theme);
        }

        function toggleNightMode() {
            const currentTheme = localStorage.getItem('theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        }

        // Initialize Theme preference on boot
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
        });

        // 2. Fetch Weather API Call
        async function fetchWeather() {
            const city = document.getElementById('city').value;
            const status = document.getElementById('weatherStatus');
            if (!city) {
                alert('Please enter a city name!');
                return;
            }
            status.innerText = "Fetching weather...";
            status.className = "form-text text-primary";

            try {
                const response = await fetch(`/weather?city=${encodeURIComponent(city)}`);
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('temperature').value = data.temperature;
                    document.getElementById('humidity').value = data.humidity;
                    status.innerText = `Fetched for ${data.city_name}: ${data.temperature}°C, ${data.humidity}% Humidity`;
                    status.className = "form-text text-success fw-semibold";
                } else {
                    status.innerText = data.detail || "City not found.";
                    status.className = "form-text text-danger";
                }
            } catch (err) {
                status.innerText = "Error fetching weather.";
                status.className = "form-text text-danger";
            }
        }

        // 3. Form Submission Handling
        document.getElementById('cropForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                N: parseFloat(document.getElementById('N').value),
                P: parseFloat(document.getElementById('P').value),
                K: parseFloat(document.getElementById('K').value),
                temperature: parseFloat(document.getElementById('temperature').value),
                humidity: parseFloat(document.getElementById('humidity').value),
                ph: parseFloat(document.getElementById('ph').value),
                rainfall: parseFloat(document.getElementById('rainfall').value)
            };

            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                const resultDiv = document.getElementById('resultCard');
                if (res.ok) {
                    document.getElementById('cropName').innerText = data.recommended_crop;
                    document.getElementById('confidence').innerText = (data.confidence_score * 100).toFixed(1) + "%";
                    resultDiv.className = "mt-4 p-3 rounded-3 text-center bg-success-subtle text-success border border-success d-block";
                } else {
                    alert('Prediction failed.');
                }
            } catch (err) {
                alert('Error connecting to prediction server.');
            }
        });
    </script>
</body>
</html>
